# --- DeterministicHasher::write `|` combines, lines 120 and 125 (equivalent) --------------
# Both combines have one shape, `(lo as u128) | ((hi as u128) << 64)` with `lo` and `hi` u64:
# line 120 over `front`/`back` (the mid branch, 9..=16 bytes) and line 125 over
# `value: [u64; 2] = read_small(data)` (the small branch, 0..=8 bytes). The first operand is a
# u64 widened to u128, so it occupies ONLY bits 0..63 (bits 64..127 are always zero). The second
# operand `(hi as u128) << 64` occupies ONLY bits 64..127 (bits 0..63 are always zero). The two
# operands therefore have DISJOINT set bits for every possible input, so `a | b == a ^ b`
# identically — `|` and `^` agree on all inputs at both sites. This is structurally guaranteed
# by the u64->u128 widening + 64-bit shift, independent of the bytes hashed, so no reachable
# input distinguishes `|` from `^` here. (Pinning a specific bucket id, e.g. for "hello",
# cannot kill it: the combined value — and thus the hash and bucket id — is identical under
# the mutant.) The `|` -> `&` mutants at the same two sites are not equivalent and are not
# suppressed.
[[suppress]]
kind = "line"
category = "equivalent"
file = "crates/mega-evm/src/external/hasher/fallback.rs"
mutant = "crates/mega-evm/src/external/hasher/fallback.rs:120:48: replace | with ^ in <impl core::hash::Hasher for DeterministicHasher>::write"
justification = "Equivalent: `(front as u128) | ((back as u128) << 64)` ORs a u64-widened low half (bits 0..63 only) with a u64-widened high half shifted into bits 64..127 only. The operands have disjoint set bits by construction for every input, so | == ^ identically; no reachable input distinguishes them."
reviewer = "RealiCZ"

[[suppress]]
kind = "line"
category = "equivalent"
file = "crates/mega-evm/src/external/hasher/fallback.rs"
mutant = "crates/mega-evm/src/external/hasher/fallback.rs:125:47: replace | with ^ in <impl core::hash::Hasher for DeterministicHasher>::write"
justification = "Equivalent: `(value[0] as u128) | ((value[1] as u128) << 64)` ORs a u64-widened low half (bits 0..63 only) with a u64-widened high half shifted into bits 64..127 only. The operands have disjoint set bits by construction for every input, so | == ^ identically; no reachable input distinguishes them."
reviewer = "improve-mutation-score (William Aaron Cheung)"

# --- DeterministicHasher typed write_uN / update mutants (dead outside the unit tests) ------------
# `AHashBucketHasher` — the crate's ONLY public hasher — computes bucket ids via
# `hash(bytes)` (hasher/mod.rs), which calls `DeterministicHasher::write(&[u8])` (the slice
# write) and `finish()`. The slice `write` routes exclusively through `large_update`; it
# never calls the typed `write_u8/u16/u32/u64/u128` methods nor the `update` helper.
#
# `update` is reached ONLY from `write_u8/u16/u32/u64` (and `write_usize` -> `write_u64`);
# those typed `write_uN` methods are reached ONLY through `core::hash::Hasher` trait dispatch.
# `DeterministicHasher` / `RandomState` live in the hasher's private `fallback` module, so no
# integration test (a separate crate) can construct a hasher and drive the typed writes, and no
# non-test code outside the hasher module names them. The typed methods exist solely to satisfy
# the `core::hash::Hasher` trait contract; no bucket id depends on them.
#
# The mutation run executes the lib's unit tests (nextest over the whole package), so the inline
# unit test `test_hasher_typed_write_methods` does run the typed writes. It asserts only that the
# typed hashes of one value differ from one another and that `write_u64` and `write_usize`
# agree, never what a hash is. It kills `update -> ()` (the typed writes then collide) and
# `write_usize -> ()` (it then differs from `write_u64`), which are not suppressed. The seven
# mutants below keep those relations: applied one at a time, each passes the hasher's unit tests
# and the whole mega-evm lib and test suite. Recorded here as dead code.
