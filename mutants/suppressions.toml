category = "dead"
file = "crates/mega-evm/src/external/hasher/fallback.rs"
mutant = "replace ^ with | in DeterministicHasher::update"
justification = "Dead outside the unit tests: bucket_id drives only the slice write() -> large_update, and update() is reached solely via the typed write_uN methods, which no non-test code calls. test_hasher_typed_write_methods runs it but asserts only that the typed hashes differ from one another, which `new_data | buffer` keeps; observed passing the hasher tests and the whole mega-evm suite. Changes no bucket id."
