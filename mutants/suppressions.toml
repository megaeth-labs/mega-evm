justification = "Unreachable: `compute_gas_ext::call_code` is installed only by the mini_rex tables (instructions.rs:201-203 selects them for MINI_REX/MINI_REX_2; the CALLCODE assignment is instructions.rs:1015). From `mod rex` on, CALLCODE is replaced by `forward_gas_ext::call_code` (instructions.rs:305) and at REX4 by `volatile_data_ext::call_code` (instructions.rs:418); `mod rex5` inherits rex4's table (instructions.rs:467). The only specs that reach this line have behaviour <= MINI_REX, where `is_enabled(REX4)`, `is_enabled(REX5)` and `is_enabled(REX6)` are all false, so the mutant keeps `stipend_from_revm` at 0 exactly as the original does."
reviewer = "RealiCZ"

