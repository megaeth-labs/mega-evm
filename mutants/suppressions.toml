# --- host.rs: recreate_reverted_account_read, resident-delegate guard (equivalent) ---
#
# The recreated CALL-family read loads the EIP-7702 delegate only when the journal holds no entry
# for it. Forcing the guard to `true` also re-loads a resident delegate. The caller's frame is
# halting, so every journaled effect of that load (the `AccountWarmed` entry of a cold one) is
# undone by the frame's revert. The unjournaled cold-load effects in revm-context 18.0.3
# `load_account_mut_optional` are no-ops for any entry reachable here: `set_current_info_as_original`
# rewrites the original info with the current one, which equal each other while the entry is cold
# (an entry turns cold only through the revert of the frame that warmed it, which also restores
# its info); `unmark_created_locally` finds the flag already cleared (that revert unmarks the
# creation too); the local-selfdestruct cleanup needs an entry left over from an earlier
# transaction, and the journal starts empty for every transaction. An untouched entry is skipped
# on commit, and the entry stays resident either way, so the state the transaction hands back has
# the same keys.
