category = "equivalent"
file = "crates/mega-evm/src/limit/checkpoint.rs"
mutant = "replace CheckpointTracker::has_clamp -> bool with false"
justification = "Equivalent: has_clamp is consumed only by two debug_assert!(!has_clamp()) sites (checkpoint_clamp_amount, before_frame_run). Those fire only on an outstanding-clamp invariant violation that no green test reaches, so forcing the predicate to false cannot change any passing test. Release builds compile the asserts out (zero call sites). The has_clamp -> true sibling is not equivalent and is killed by the same asserts."
