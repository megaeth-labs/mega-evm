# Mutation-testing suppressions.
#
# A suppressed mutant is one that survives the test suite but is NOT a test gap:
# it is either an *equivalent mutant* (cannot change observable behavior) or
# dead/defensive code that is impractical-but-correct to leave unkillable.
#
# Suppressing a mutant requires a justification and a reviewer. Adding an entry
# here is a reviewed decision — treat it with the same scrutiny as disabling a
# test. The PR gate (scripts/mutation_gate.py) excludes these from "new survivor"
# accounting.
#
# Two granularities (the "hybrid" model):
#   kind = "function"  -> matched as an --exclude-re against the mutant NAME.
#                         Use for whole functions that are entirely equivalent or
#                         dead (stable across line moves). `pattern` is a regex.
#   kind = "line"      -> matched against the exact mutant description line from
#                         missed.txt OR timeout.txt. Use for a single surviving
#                         mutant inside an otherwise-tested function, or to accept
#                         a genuinely non-terminating/equivalent timed-out mutant.
#                         `mutant` is the literal text (without "file:line:col: "),
#                         or, when several mutants share that text, the full
#                         "file:line:col: text" line of each one suppressed: a
#                         bare text that matches more than one mutant fails the
#                         gate.
#
# Every entry also carries:
#   category = "equivalent" | "dead"
#     "equivalent" -> reachable code, but the mutation cannot change observable
#                     behavior on any valid input.
#     "dead"       -> the mutated code is unreachable (zero call sites / an
#                     unsatisfiable bound / not reachable from the public API).
#   justification  -> the proof; reviewer -> who signed off.
#
# Inline `#[mutants::skip]` on a function is also honored natively by
# cargo-mutants and is appropriate for truly dead helpers; prefer this file when
# the decision needs a recorded justification.
#
# CAVEAT — suppression rot. A `kind = "function"` entry becomes an --exclude-re,
# so the function is never mutated again: if a "dead today" function later gains
# a caller, its mutants silently stop being generated and no gap is reported.
# `kind = "line"` is safer — the mutant is still generated and run every time, so
# if the code changes such that a test now kills it, it simply shows up as caught
# and the suppression becomes a harmless no-op. Prefer "line" unless the whole
# function is genuinely, permanently dead, and re-audit the "function" entries
# (and every "dead" justification) whenever their surrounding code changes. The
# nightly full-crate run (.github/workflows/mutation.yml) re-checks "line"
# entries against real source for exactly this reason.

