justification = "Equivalent: re-loading a delegate that is already resident happens in a halting frame, whose revert undoes the journaled warm-up; revm's unjournaled cold-load effects are no-ops for such an entry (current info equals original info while cold, the created-locally flag was cleared by the same revert that cooled it, and no entry survives from an earlier transaction), and the entry stays resident either way, so gas, state, result and the returned state keys are unchanged. Full suite green with the mutant applied."
