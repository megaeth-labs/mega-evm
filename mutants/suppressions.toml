# --- instructions.rs:671 += → *= in rex7::instruction_table (dead: non-terminating) -
#
# The loop copies INHERITED_FROM_REX6 into the Rex7 table: `while i < len { ...; i += 1 }`.
# `i *= 1` is a no-op increment, so the loop never advances. The function is `const fn`, so
# the mutant hangs const evaluation / the test build rather than producing a distinguishable
# wrong table — structurally unkillable. The neighbouring `+=` → `-=` and the loop-bound
# `<` / `==` / `>` mutants do terminate and are killed by opcode-set tests.
