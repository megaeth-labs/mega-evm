# --- sandbox/state_merge.rs: same-hash code copy, `&&` -> `||` (equivalent) ---
#
# When the sandbox and the parent agree on an account's code hash, the merge copies the sandbox's
# bytecode into the parent only if the parent's hash is non-empty and its cached code is missing
# or empty (a stale cache). With `||` it also copies in two more cases, neither of which changes
# what any reader sees:
#   * non-empty hash, parent code already present: the copy has the same hash, so the same bytes;
#   * empty hash (`KECCAK_EMPTY`): the copied bytecode hashes to `KECCAK_EMPTY`, so it is empty,
#     and the parent's `None` or empty code becomes `Some(empty)`. revm itself stores
#     `Some(Bytecode::default())` without a database read whenever it loads the code of an
#     empty-hash account (revm-context-interface 19.0.3 `load_code_preserve_error`), so every
#     reader already treats `None` and `Some(empty)` alike.
# Gas, results, the journal and the committed state are unchanged.
