# `CheckpointTracker::has_clamp` has exactly two call sites, both `debug_assert!(!has_clamp())`
# (limit.rs `checkpoint_clamp_amount` and `before_frame_run`). Those asserts fire only if a
# clamp is already outstanding when a new one is applied or a frame is resumed — an invariant
# violation that no green test reaches. Replacing the predicate with `false` makes
# `debug_assert!(!false)` always pass, so every currently-passing test stays green. Release
# builds compile the asserts out, leaving `has_clamp` with zero call sites. The sibling
# `has_clamp -> true` mutant *does* trip those asserts on every REX7 clamp path and is killed.
# Do not add a `#[should_panic]` test of the debug_assert.
