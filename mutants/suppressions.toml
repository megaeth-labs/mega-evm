# --- Entry::address's format check (equivalent: the parser enforces the same) -------------
# `Entry::address` refuses a value unless it is `0x` and then 40 hexadecimal digits, and then
# parses the digits with `Address::from_str`, which is alloy's `FixedBytes::from_hex`: it strips
# an optional `0x` prefix, refuses an odd length, a length other than 40 digits and any
# non-hexadecimal byte. `||` -> `&&` lets through only digits that fail one test and pass the
# other — 40 bytes that are not all hexadecimal, or an all-hexadecimal string of another
# length — and the parser refuses every one of them, with the same `invalid()` error the check
# returns. A line entry keeps the mutant generated: if alloy's parser ever accepts such a string,
# the format tests of `genesis.rs` kill it.
[[suppress]]
kind = "line"
category = "equivalent"
file = "crates/mega-evm/src/block/genesis.rs"
line = 290
column = 31
mutant = "replace || with && in Entry::address"
justification = "Equivalent: every string the mutated check lets through (40 bytes not all hexadecimal, or all-hexadecimal of another length) is refused by Address::from_str (alloy's FixedBytes::from_hex: exact 40 hex digits after an optional 0x), and the refusal maps to the same invalid() error, so the result is identical for every input."
reviewer = "RealiCZ"

