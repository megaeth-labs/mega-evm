name: Differential

# Runs every scenario of the differential corpus through MegaEvm and through stock revm 43 and
# fails on any difference the deviation registry does not explain, or on a registry effect that
# explains nothing. See crates/mega-differential/README.md.

on:
  pull_request:
  push:
    branches: [satin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  differential:
    name: differential
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run the corpus
        run: cargo test -p mega-differential --locked -- --nocapture
