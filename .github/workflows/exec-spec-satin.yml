name: Execution-spec tests on Satin

# Runs the execution-spec-test state fixtures through MegaEvm with the state-test runner
# (crates/mega-state-test), on one download of the fixtures:
#
# - equivalence mode, a gate: Satin's machinery priced as each fixture fork prices it, on the
#   Osaka entries of the main release and the Amsterdam entries of the glamsterdam devnet
#   release. Every test passes, is skipped for a reason the fork's own runner shares, or fails on
#   a deviation registered in crates/mega-state-test/src/deviations.rs, which lists the exact
#   entries it explains with the hashes Satin produces, and every listed entry fails exactly as
#   listed; the executed and skipped counts are pinned below.
# - Satin mode, a report: the same entries under Satin's own configuration, counted by outcome
#   in the step summary. It does not fail the job.
# - the witness replay, a gate: every entry of both fixture releases, in both modes, executed on
#   a recorder of every read and replayed on a strict database and environments that serve
#   exactly a witness (crates/mega-state-test/src/witness.rs). An entry the engine executes
#   replays on the record of every read and on the witness a node builds from its channels; one
#   it rejects, on the record alone. Any entry that fails to replay fails the job.
# - the blockchain tests, a gate: the Osaka tests of the main release's `blockchain_tests`, imported
#   block by block through Satin's block executor in equivalence mode's configuration (`state-test
#   btest`). Every block's gas used, logs bloom, receipts root and state root are held to its
#   header, and every block the fixture expects to be invalid must be refused for the exception it
#   names. A test passes, is skipped for a class decided from its content, or fails on a registered
#   deviation; the executed and skipped counts are pinned below. The devnet release's blockchain
#   tests are not run: the fork's runner skips them too.
#
# The fixture releases are the ones the revm fork's `scripts/run-tests.sh` names at the tag
# Cargo.lock pins, so this gate and the fork runner's (exec-spec.yml) judge the same fixtures.
#
# The `execution-spec gate on Satin` job always runs and reports the gate: it passes when the gate
# passed, or when a pull request changes nothing the gate covers and the gate did not run. It is
# the check a branch rule can require; a path filter on the pull request trigger would leave that
# check pending on every pull request it filters out, so pull requests are filtered by the
# `changes` job instead.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [satin]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/mega-evm/**
      - crates/mega-state-test/**
      - crates/state-test/**
      - crates/system-contracts/**
      - .github/workflows/exec-spec-satin.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes the gate covers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # The merge commit and its parents; the first parent is the base it merges into.
          fetch-depth: 2
          persist-credentials: false

      - name: Compare the pull request with its base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to satin passed the push trigger's path filter, and a manual run asks for the gate.
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify -q 'HEAD^2' > /dev/null; then
            echo "::warning::HEAD is not the pull request's merge commit; running the gate"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The paths the push trigger filters on; the two lists stay equal. A rename lists both of
          # its paths, so a file moved out of a covered path counts.
          covered='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.github/workflows/exec-spec-satin\.yml)$|^crates/(mega-evm|mega-state-test|state-test|system-contracts)/'
          if git diff --name-only --no-renames 'HEAD^1' HEAD | grep -qE "$covered"; then
            run=true
          else
            run=false
          fi
          echo "the gate runs: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  exec-spec-satin:
    name: execution-spec tests on Satin
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Tests equivalence mode executes and skips, per fork, on the pinned fixture releases. The
      # runner skips what the fork's own runner skips, so these are the counts exec-spec.yml pins
      # for it. A change that moves the fork pin, and with it the fixtures, updates both, and the
      # entries the deviations in crates/mega-state-test/src/deviations.rs list.
      OSAKA_EXECUTED: "19465"
      OSAKA_SKIPPED: "52"
      AMSTERDAM_EXECUTED: "15754"
      AMSTERDAM_SKIPPED: "72"
      # The Osaka blockchain tests the blockchain gate executes, and those it skips by class. A
      # change that moves the fixtures updates both, and the blockchain tests the deviations list.
      BLOCKCHAIN_EXECUTED: "18713"
      BLOCKCHAIN_SKIPPED: >-
        withdrawals=62 blob-transactions=2540 requests=174 header-or-body=17
        undecodable-invalid-transaction=2 create-collision-with-storage=50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read the fork pin from Cargo.lock
        id: pin
        run: |
          sources=$(grep -o 'git+https://github.com/megaeth-labs/revm?tag=[^"#]*#[0-9a-f]*' Cargo.lock | sort -u)
          if [ "$(printf '%s\n' "$sources" | grep -c .)" -ne 1 ]; then
            printf 'expected exactly one revm fork revision in Cargo.lock, found:\n%s\n' "$sources" >&2
            exit 1
          fi
          tag=${sources#*tag=}
          tag=${tag%%#*}
          commit=${sources##*#}
          echo "fork tag $tag at $commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: megaeth-labs/revm
          ref: ${{ steps.pin.outputs.tag }}
          path: revm-fork
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check the tag names the locked revision
        working-directory: revm-fork
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Read the fixture releases the fork's runner downloads
        id: fixtures
        run: |
          set -euo pipefail
          script=revm-fork/scripts/run-tests.sh
          # One `NAME="value"` assignment each; a script that no longer has one fails the step
          # rather than downloading something else.
          read_var() {
            local value
            value=$(sed -n "s/^$1=\"\(.*\)\"$/\1/p" "$script")
            if [ -z "$value" ] || [ "$(printf '%s\n' "$value" | grep -c .)" -ne 1 ]; then
              echo "::error::$script: no single $1 assignment" >&2
              return 1
            fi
            printf '%s' "$value"
          }
          main_version=$(read_var MAIN_VERSION)
          devnet_version=$(read_var DEVNET_VERSION)
          main_url=$(read_var FIXTURES_URL)
          devnet_url=$(read_var DEVNET_FIXTURES_URL)
          devnet_tar=$(read_var DEVNET_TAR)
          # The runner downloads the develop release unless REVM_STATETEST_STABLE is set.
          grep -q '^    MAIN_TAR="fixtures_develop.tar.gz"$' "$script"
          main="$main_url/$main_version/fixtures_develop.tar.gz"
          devnet="$devnet_url/$devnet_version/$devnet_tar"
          # The directories taken out of each archive: the state tests of both, and the blockchain
          # tests of the main release.
          main_dirs="state_tests blockchain_tests"
          devnet_dirs="state_tests"
          # The cache is keyed on the archives themselves, and on what is taken out of them:
          # another name or host at the same version is another download, and a cache that holds
          # other directories is another cache.
          archives=$(printf '%s\n%s\n%s\n%s\n' "$main" "$devnet" "$main_dirs" "$devnet_dirs" \
            | sha256sum | cut -c1-16)
          {
            echo "main=$main"
            echo "devnet=$devnet"
            echo "main_dirs=$main_dirs"
            echo "devnet_dirs=$devnet_dirs"
            echo "key=eest-fixtures-$main_version-$devnet_version-$archives"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the fixtures
        id: cache
        uses: actions/cache@v4
        with:
          path: fixtures
          key: ${{ steps.fixtures.outputs.key }}

      - name: Download the fixtures
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MAIN_URL: ${{ steps.fixtures.outputs.main }}
          DEVNET_URL: ${{ steps.fixtures.outputs.devnet }}
          MAIN_DIRS: ${{ steps.fixtures.outputs.main_dirs }}
          DEVNET_DIRS: ${{ steps.fixtures.outputs.devnet_dirs }}
        run: |
          set -euo pipefail
          # fetch NAME URL DIRS: the directories DIRS names, out of the archive at URL, under
          # fixtures/NAME. The archive's top-level `fixtures/` directory is stripped, as the fork's
          # runner strips it.
          fetch() {
            local dir members=()
            for dir in $3; do members+=("fixtures/$dir"); done
            mkdir -p "fixtures/$1"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$2" -o "fixtures/$1.tar.gz"
            tar -xzf "fixtures/$1.tar.gz" --strip-components=1 -C "fixtures/$1" "${members[@]}"
            rm "fixtures/$1.tar.gz"
          }
          fetch main "$MAIN_URL" "$MAIN_DIRS"
          fetch devnet "$DEVNET_URL" "$DEVNET_DIRS"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build the runner
        run: cargo build --release --locked -p state-test

      - name: Equivalence mode, the gate
        run: |
          set -uo pipefail
          {
            echo "### Equivalence mode"
            echo
            echo "| Fixtures | Executed | Skipped | Passed | Deviated | Unattributed | Unreproduced |"
            echo "|---|---:|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          gate() {
            local fork=$1 dir=$2 executed=$3 skipped=$4 status=0
            target/release/state-test --fork "$fork" "$dir" \
              --expect-executed "$executed" --expect-skipped "$skipped" --expect-deviations \
              --summary-json "equivalence-$fork.json" || status=$?
            if [ -f "equivalence-$fork.json" ]; then
              jq -r --arg fork "$fork" '.summary as $s | "| \($fork) | \($s.executed) | \([$s.skipped[]] | add // 0) | \($s.passed) | \([$s.deviated[]] | add // 0) | \($s.unattributed) | \([$s.unreproduced[]] | add // 0) |"' \
                "equivalence-$fork.json" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::equivalence mode failed on the $fork fixtures"
            fi
            return "$status"
          }
          status=0
          gate Osaka fixtures/main/state_tests "$OSAKA_EXECUTED" "$OSAKA_SKIPPED" || status=1
          gate Amsterdam fixtures/devnet/state_tests "$AMSTERDAM_EXECUTED" "$AMSTERDAM_SKIPPED" || status=1
          exit "$status"

      - name: Satin mode, the report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "### Satin mode (a report)"
            echo
            echo "| Fixtures | Executed | Skipped | Passed | Failed | Failed by kind |"
            echo "|---|---:|---:|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for run in "Osaka fixtures/main/state_tests" "Amsterdam fixtures/devnet/state_tests"; do
            read -r fork dir <<< "$run"
            target/release/state-test --mode satin --fork "$fork" "$dir" \
              --summary-json "satin-$fork.json" || status=1
            if [ -f "satin-$fork.json" ]; then
              jq -r --arg fork "$fork" '.summary as $s | "| \($fork) | \($s.executed) | \([$s.skipped[]] | add // 0) | \($s.passed) | \([$s.failed[]] | add // 0) | \($s.failed | to_entries | map("\(.key) \(.value)") | join(", ")) |"' \
                "satin-$fork.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"

      - name: Witness replay over the fixtures, the gate
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          {
            echo "### Witness replay"
            echo
            echo "| Fixtures | Mode | Replayed on both witnesses | Rejected, replayed on the record alone | Skipped | Failed |"
            echo "|---|---|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo test --release --locked -p mega-state-test --test witness --no-run || exit 1
          status=0
          for run in "Osaka fixtures/main/state_tests" "Amsterdam fixtures/devnet/state_tests"; do
            read -r fork dir <<< "$run"
            for mode in equivalence satin; do
              # The test runs in the package's directory, so the fixtures are named by an absolute path.
              rc=0
              MEGA_STATE_TEST_FIXTURES="$GITHUB_WORKSPACE/$dir" MEGA_STATE_TEST_SAMPLE=0 \
                MEGA_STATE_TEST_FORK="$fork" MEGA_STATE_TEST_MODE="$mode" \
                cargo test --release --locked -p mega-state-test --test witness -- --ignored --nocapture \
                2>&1 | tee "witness-$fork-$mode.log" || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "::error::the witness replay failed on the $fork fixtures in $mode mode"
                status=1
              fi
              # A run passes only on exactly one summary line, in the full format, for this fork and
              # mode, that executed entries and failed none: a run that tested nothing, or whose
              # output changed shape, fails the gate rather than passing silently.
              mapfile -t lines < <(grep '^witness replay of ' "witness-$fork-$mode.log" || true)
              summary='^witness replay of ([0-9]+) fixture files in ([a-z]+) mode on ([A-Za-z]+): ([0-9]+) executed and replayed on both witnesses, ([0-9]+) rejected and replayed on the database record alone, ([0-9]+) skipped, ([0-9]+) failed$'
              if [ "${#lines[@]}" -ne 1 ]; then
                echo "::error::the $fork $mode run printed ${#lines[@]} summary lines, not one"
                status=1
              elif ! [[ ${lines[0]} =~ $summary ]]; then
                echo "::error::the $fork $mode summary is not in the expected format: ${lines[0]}"
                status=1
              elif [ "${BASH_REMATCH[3]}" != "$fork" ] || [ "${BASH_REMATCH[2]}" != "$mode" ]; then
                echo "::error::the $fork $mode run reported ${BASH_REMATCH[3]} in ${BASH_REMATCH[2]} mode"
                status=1
              elif [ "${BASH_REMATCH[1]}" -eq 0 ] || [ "${BASH_REMATCH[4]}" -eq 0 ]; then
                echo "::error::the $fork $mode run executed nothing: ${lines[0]}"
                status=1
              elif [ "${BASH_REMATCH[7]}" -ne 0 ]; then
                echo "::error::the $fork $mode run failed ${BASH_REMATCH[7]} entries"
                status=1
              else
                echo "| $fork | $mode | ${BASH_REMATCH[4]} | ${BASH_REMATCH[5]} | ${BASH_REMATCH[6]} | ${BASH_REMATCH[7]} |" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit "$status"

      - name: Blockchain tests through the block executor, the gate
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          {
            echo "### Blockchain tests"
            echo
            echo "| Fixtures | Executed | Skipped | Passed | Deviated | Unattributed | Unreproduced | Blocks accepted | Blocks refused |"
            echo "|---|---:|---:|---:|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          pins=()
          for pin in $BLOCKCHAIN_SKIPPED; do pins+=(--expect-skipped "$pin"); done
          rm -f blockchain-Osaka.json
          status=0
          target/release/state-test btest fixtures/main/blockchain_tests \
            --expect-executed "$BLOCKCHAIN_EXECUTED" "${pins[@]}" --expect-deviations \
            --summary-json blockchain-Osaka.json || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the blockchain tests failed the gate"
          fi
          # The gate passes only on a summary in the expected shape, for the Osaka blockchain tests,
          # that executed tests and has no failure no deviation explains, no unread fixture and no
          # listed test that did not fail as listed: a run that tested nothing, or whose summary
          # changed shape, fails the gate rather than passing silently.
          shape='.suite == "blockchain" and .fork == "Osaka" and (.skip_reasons | type) == "object"
            and (.summary | (.executed | type) == "number" and (.passed | type) == "number"
              and (.unattributed | type) == "number" and (.file_failures | type) == "number"
              and (.skipped | type) == "object" and (.deviated | type) == "object"
              and (.unreproduced | type) == "object" and (.blocks.accepted | type) == "number"
              and (.blocks.refused | type) == "number")'
          if [ ! -f blockchain-Osaka.json ]; then
            echo "::error::the blockchain tests wrote no summary"
            status=1
          elif ! jq -e "$shape" blockchain-Osaka.json > /dev/null 2>&1; then
            echo "::error::the blockchain tests' summary is not in the expected shape"
            status=1
          elif ! jq -e '.summary.executed > 0' blockchain-Osaka.json > /dev/null; then
            echo "::error::the blockchain tests executed nothing"
            status=1
          elif ! jq -e '.summary | .unattributed == 0 and .file_failures == 0 and (.unreproduced | add // 0) == 0' \
            blockchain-Osaka.json > /dev/null; then
            echo "::error::the blockchain tests have a failure no deviation explains, an unread fixture or an unreproduced deviation"
            status=1
          else
            jq -r '.summary as $s | "| Osaka | \($s.executed) | \([$s.skipped[]] | add // 0) | \($s.passed) | \([$s.deviated[]] | add // 0) | \($s.unattributed) | \([$s.unreproduced[]] | add // 0) | \($s.blocks.accepted) | \($s.blocks.refused) |"' \
              blockchain-Osaka.json >> "$GITHUB_STEP_SUMMARY"
            {
              echo
              echo "| Skipped for | Tests | Why |"
              echo "|---|---:|---|"
              jq -r '.summary.skipped as $s | .skip_reasons | to_entries[] | "| \(.key) | \($s[.key] // 0) | \(.value) |"' \
                blockchain-Osaka.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  gate:
    name: execution-spec gate on Satin
    needs: [changes, exec-spec-satin]
    # Always, a cancelled run included: a required check that is skipped counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the gate's outcome
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          GATE: ${{ needs.exec-spec-satin.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::could not tell whether the gate had to run: the changes job ended $CHANGES"
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "nothing the gate covers changed; the gate did not run"
            exit 0
          fi
          if [ "$GATE" != success ]; then
            echo "::error::the gate ended $GATE"
            exit 1
          fi
          echo "the gate passed"
