name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "ERROR: Cargo.toml version ($cargo_version) does not match tag ($tag_version)"
            exit 1
          fi

      # Packaging fails fast on manifests crates.io would reject — e.g. git-pinned
      # dependencies without a registry version — before anything is uploaded. Without this
      # check the job publishes the first crates and then fails midway, leaving a partial
      # release on crates.io.
      - name: Pre-flight packaging check
        run: |
          for crate in mega-system-contracts mega-evm mega-state-test mega-evme; do
            cargo package -p "$crate" --no-verify --locked
          done

      - name: Publish mega-system-contracts
        run: cargo publish -p mega-system-contracts --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 90

      - name: Publish mega-evm
        run: cargo publish -p mega-evm --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 90

      # The state-test runner library; mega-evme depends on it, so it is
      # published after mega-evm and before mega-evme. (The `state-test` CLI crate
      # is `publish = false`.)
      - name: Publish mega-state-test
        run: cargo publish -p mega-state-test --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 90

      - name: Publish mega-evme
        run: cargo publish -p mega-evme --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
