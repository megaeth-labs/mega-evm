name: Build & Test
on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Attest system contract bytecode
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/system-contract-artifacts
        run: cargo run --locked -p system-contract-artifacts -- attest
      - name: Attestation negative control
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/system-contract-artifacts
        run: bash .github/scripts/check_system_contract_attestation.sh
      - name: Check generated system contract constants
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/system-contract-artifacts
        run: cargo run --locked -p system-contract-artifacts -- check
      - name: Run cargo-sort
        run: |
          cargo install cargo-sort
          cargo sort --check --workspace --grouped --order package,workspace,lints,profile,bin,benches,dependencies,dev-dependencies,features
      - name: Run Fmt
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --lib --examples --tests --benches --all-features --locked

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: cargo build
      - name: Run Test
        run: cargo test --workspace

  no-std:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install RISC-V target
        run: rustup target add riscv64imac-unknown-none-elf
      - name: Check for riscv64imac-unknown-none-elf target
        run: cargo check -p mega-evm --target riscv64imac-unknown-none-elf --no-default-features
      - name: Check with std feature
        run: cargo check -p mega-evm --features std
