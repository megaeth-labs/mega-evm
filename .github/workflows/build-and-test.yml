name: Build & Test
on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run cargo-sort
        run: |
          cargo install cargo-sort
          cargo sort --check --workspace --grouped --order package,workspace,lints,profile,bin,benches,dependencies,dev-dependencies,features
      - name: Run Fmt
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --lib --examples --tests --benches --all-features --locked

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: cargo build
      - name: Run Test
        run: cargo test --workspace

  test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run tests in release
        run: cargo test --workspace --release --locked

  system-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run forge tests
        working-directory: crates/system-contracts
        run: forge test

  msrv:
    runs-on: ubuntu-24.04
    # Sized for a cold cache, which compiles the whole graph, the legacy leg's included, and then
    # the no_std target.
    timeout-minutes: 15
    env:
      # The workspace's declared `rust-version`; the variable takes precedence over
      # rust-toolchain.toml, so every cargo call below runs on it.
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust 1.94.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Installed in place of rust-toolchain.toml's, and set as the directory's override; the
          # cache is keyed on it, apart from the other jobs'.
          toolchain: "1.94.0"
          target: riscv64imac-unknown-none-elf
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Check the workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Check no_std
        run: cargo check -p mega-evm --target riscv64imac-unknown-none-elf --no-default-features --locked

  # The randomized tests (crates/mega-evm/tests/fuzz) in their bounded mode, in a release build:
  # the debug run is part of `cargo test --workspace` above and exercises every debug assertion;
  # the release run exercises the code the sequencer ships, where those assertions are gone. Both
  # are deterministic (a fixed seed, a fixed case count) and finish in well under a minute.
  # The long mode runs on dispatch (fuzz.yml).
  fuzz-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run the randomized tests in release
        run: cargo test --release --locked -p mega-evm --test fuzz

  no-std:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install RISC-V target
        run: rustup target add riscv64imac-unknown-none-elf
      - name: Check for riscv64imac-unknown-none-elf target
        run: cargo check -p mega-evm --target riscv64imac-unknown-none-elf --no-default-features
      - name: Check with std feature
        run: cargo check -p mega-evm --features std
