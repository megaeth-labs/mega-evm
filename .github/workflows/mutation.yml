name: Mutation Testing

# All mutation-testing CI lives here. Four concerns, one file:
#   * cargo-mutants gate   — generic operators (diff-scoped on PRs, full nightly,
#                            both in four shards with a single scoring job)
#   * infrastructure gate  — the same operators on the code that implements the
#                            test gates, which the production scope excludes
#   * suppression hygiene  — flag suppressions that no longer match a live mutant
#   * gate self-test       — the scorer's and the driver's own tests
# The cargo-mutants and infrastructure gates share the scorer
# scripts/mutation_gate.py.
# The spec-gate operator pack stays on disk. A single-spec engine has no spec
# gate for it to mutate, so this workflow does not run it. Suppression hygiene
# still plans the pack and accepts an empty plan. See mutants/README.md.

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Nightly: full-crate cargo-mutants re-verify (the diff gate never mutates
    # #[cfg(test)] code, so the in-repo killing tests are only re-checked here)
    # and the suppression-hygiene check.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to upsert the result comments

jobs:
  # ── cargo-mutants: diff-scoped gate on PRs, full-crate run nightly ──────────
  # Both runs use four cargo-mutants shards (consecutive slices of the mutant
  # list). Their join scores against the unsharded inventory so a shard that
  # fails or runs out of time leaves untested mutants in the report.
  cargo-mutants:
    name: ${{ github.event_name == 'pull_request' && format('cargo-mutants gate shard {0}', matrix.shard) || format('cargo-mutants shard {0}', matrix.shard) }}
    runs-on: ubuntu-24.04
    # MUTANTS_BUDGET stops the driver early enough to upload partial results.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # need base history for the diff

      - name: Decide whether the run builds
        # A PR that changes no mutatable source has nothing to mutate, and the
        # driver skips its warm build. The Rust cache is then neither restored
        # (nothing would use it) nor saved: the save would store a target with
        # nothing compiled in it, and a later run of this PR that hit that entry
        # would rebuild every dependency without ever saving a better one.
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/mutation_test.sh changed "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: ${{ steps.scope.outputs.mutate }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          # Pin the version: a new cargo-mutants release can change the set of
          # generated mutants, which would silently shift the gate's baseline.
          tool: cargo-mutants@27.1.0

      - name: Run mutation testing
        # On a PR: mutate only the changed lines (fast gate). On nightly or manual
        # dispatch there is no PR base, so run the whole crate, sharded, instead of
        # feeding an empty base into `diff` mode (which would fail).
        #
        # The driver first builds the tests into ./target, so (a) Swatinem/rust-cache
        # (bundled in setup-rust-toolchain) caches the compiled dependencies, and
        # (b) cargo-mutants' `copy_target` seeds each scratch build from this warm
        # target — so per-mutant builds skip recompiling dependencies. It re-runs a
        # mutant that timed out once, alone, into target/mutants/recheck, and runs a
        # mutant the tests still miss against the Mega EEST suite
        # (scripts/mega_eest.sh, through mega-evm's ignored `mega_eest` test), into
        # target/mutants/mega-eest: the gate takes those outcomes for them.
        env:
          # setup-rust-toolchain exports CARGO_INCREMENTAL=0. Every mutant rebuilds
          # mega-evm and all of its test binaries; incremental compilation, for the
          # warm build and the mutant builds alike, lets each of those rebuilds
          # reuse what the mutation did not touch.
          CARGO_INCREMENTAL: "1"
          # Seconds from the driver's start (300 min), the follow-up runs included.
          # Leaves the job's 330-minute limit room for setup, the driver's stop grace
          # period, upload and the cache save.
          MUTANTS_BUDGET: "18000"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MUTANTS_SHARD="${{ matrix.shard }}" scripts/mutation_test.sh diff "${{ github.event.pull_request.base.sha }}"
          else
            scripts/mutation_test.sh full --shard "${{ matrix.shard }}"
          fi

      - name: Upload shard results
        # The artifact holds this shard's mutants.out/, status and follow-up runs
        # (recheck/, mega-eest/) at its root.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-shard-${{ strategy.job-index }}
          path: target/mutants
          if-no-files-found: ignore

  cargo-mutants-gate:
    name: cargo-mutants gate
    needs: cargo-mutants
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # list the diff against the same base as the shards

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Create fresh join directories
        id: paths
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/mutation-XXXXXXXX")"
          mkdir "$staging/shards" "$staging/report"
          echo "input=$staging/shards" >> "$GITHUB_OUTPUT"
          echo "output=$staging/report" >> "$GITHUB_OUTPUT"

      - name: Download shard results
        # Let the scorer name the missing shards even when nothing downloaded.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-results-shard-*
          path: ${{ steps.paths.outputs.input }}

      - name: Merge, score and gate
        env:
          MUTATION_INPUT_DIR: ${{ steps.paths.outputs.input }}
          MUTATION_OUTPUT_DIR: ${{ steps.paths.outputs.output }}
        run: scripts/mutation_join.sh diff "${{ github.event.pull_request.base.sha }}"

      - name: Require successful shard jobs
        # The merge detects failed runs in their artifacts. A job can also fail
        # after it uploaded a complete run, so check the matrix conclusion too.
        if: needs.cargo-mutants.result != 'success'
        env:
          MUTATION_OUTPUT_DIR: ${{ steps.paths.outputs.output }}
        run: |
          printf '%s\n' '## 🧬 Mutation testing — ❌ FAIL' '' \
            'At least one shard job failed after producing results. See the shard jobs in this workflow run.' \
            | tee "$MUTATION_OUTPUT_DIR/mutation-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upsert PR comment
        # Fork / Dependabot PRs run with a read-only token, so commenting fails;
        # don't let that fail the gate job.
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MUTATION_OUTPUT_DIR: ${{ steps.paths.outputs.output }}
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync(require('path').join(process.env.MUTATION_OUTPUT_DIR, 'mutation-report.md'), 'utf8');
            } catch {
              body = '## 🧬 Mutation testing\n\nNo report produced: the mutation run failed before the gate scored it. See the job log.';
            }
            const marker = '<!-- mutation-testing-report -->';
            body = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload mutation artifacts
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: ignore

  cargo-mutants-full:
    name: cargo-mutants full run
    needs: cargo-mutants
    # Also after a failed or timed-out shard: the report names it, and its
    # mutants count as untested.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Create fresh join directories
        id: paths
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/mutation-XXXXXXXX")"
          mkdir "$staging/shards" "$staging/report"
          echo "input=$staging/shards" >> "$GITHUB_OUTPUT"
          echo "output=$staging/report" >> "$GITHUB_OUTPUT"

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-results-shard-*
          path: ${{ steps.paths.outputs.input }}

      - name: Merge, score and gate
        env:
          MUTATION_INPUT_DIR: ${{ steps.paths.outputs.input }}
          MUTATION_OUTPUT_DIR: ${{ steps.paths.outputs.output }}
        run: scripts/mutation_join.sh full

      - name: Upload mutation artifacts
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: ignore

  # ── cargo-mutants: the test gates' own infrastructure ──────────────────────
  # The second mutation scope (.cargo/mutants-infra.toml): the scenario runner's
  # transaction conversion and execute/commit loop. The production scope
  # excludes test helpers as noise, so this executable logic is never mutated
  # there. 39 mutants today, so the whole set runs rather than a diff
  # slice. Informational: it is not a required check.
  infra-mutants:
    name: cargo-mutants infrastructure
    needs: changes
    # Always on nightly/dispatch; on PRs only when the mutated code, its
    # configuration or the driver changed.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation testing
        # The driver builds the tests first, as for the production scope.
        env:
          OUT_DIR: target/mutants-infra
          CARGO_INCREMENTAL: "1"
          # 80 minutes, inside the job's 90.
          MUTANTS_BUDGET: "4800"
        run: scripts/mutation_test.sh infra

      - name: Score and gate
        run: |
          python3 scripts/mutation_gate.py report \
            --results target/mutants-infra/mutants.out \
            --recheck target/mutants-infra/recheck/mutants.out \
            --status target/mutants-infra/status \
            --suppressions mutants/suppressions.toml \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-infra
          path: |
            target/mutants-infra/mutants.out
            target/mutants-infra/status
            target/mutants-infra/recheck/mutants.out
            target/mutants-infra.log
            target/mutants-infra/recheck.log
          if-no-files-found: ignore

  # ── gate self-test: the scorer's and the driver's own tests ────────────────
  # The gate reads a run fail-closed; its tests hold every way a run can leave
  # results that say nothing to a failure, and the driver's refusal of an old
  # bash. Every scripts/test_*.py runs here, the Mega EEST gate's helper's
  # (scripts/test_mega_eest.py) among them. Seconds long, so it runs on every PR.
  gate-selftest:
    name: mutation gate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the gate and the driver's guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  # ── suppression hygiene: gate on relevant PR changes, plus nightly ─────────
  # `changes` scopes the hygiene job to PRs that could orphan a suppression
  # (suppressions, operators, src edits, or the tools that list and match the
  # mutants) and the infrastructure job to PRs that touch its scope;
  # nightly/dispatch always run both.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      hygiene: ${{ steps.filter.outputs.hygiene }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hygiene:
              - 'mutants/suppressions.toml'
              - 'mutants/operators/**'
              - 'crates/mega-evm/src/**'
              - '.cargo/mutants.toml'
              - '.cargo/mutants-infra.toml'
              - 'scripts/mutation_test.sh'
              - 'scripts/mutation_gate.py'
              - 'scripts/umutate.py'
            infra:
              - '.cargo/mutants-infra.toml'
              - 'crates/mega-evm/src/test_utils/scenario.rs'
              - 'scripts/mutation_gate.py'
              - 'scripts/mutation_test.sh'

  orphan-suppressions:
    name: suppression hygiene
    needs: changes
    # Always on nightly/dispatch; on PRs only when a relevant path changed.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.hygiene == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Install universalmutator (mise)
        uses: jdx/mise-action@v2
      - name: Install comby
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3 libev4
          sudo curl -fsSL https://github.com/comby-tools/comby/releases/download/1.8.1/comby-1.8.1-x86_64-linux -o /usr/local/bin/comby
          sudo chmod +x /usr/local/bin/comby
          comby -version
      - name: Build the full mutant universe (both engines, both scopes)
        run: |
          # The driver's production mutant set, with --all so that it keeps the
          # mutants of function-scoped suppressions: the universe to check
          # suppressions against (--colors never, the package alone, as the runs).
          scripts/mutation_test.sh list --all > universe.txt
          # The infrastructure scope is a second mutant population and a suppression may live in
          # it, so it joins the universe. Listed through the driver, so its file list stays in
          # one place, with SUPPRESS=/dev/null so the driver emits no --exclude-re and function-
          # suppressed mutants stay in the universe here too. The grep drops the driver's
          # trailing progress lines and fails the step if the scope lists nothing.
          SUPPRESS=/dev/null scripts/mutation_test.sh infra --list --colors never \
            | grep -oE 'crates/[^:]+:[0-9]+:[0-9]+: .*' >> universe.txt
          # The plan runs on its own so a planner failure still fails the step.
          # Its mutant lines are grepped separately: a single-spec engine (the
          # satin branch) has no spec gates and the pack finds nothing. grep's
          # "no match" (exit 1) is accepted; a grep error (exit 2) still fails.
          python3 scripts/umutate.py plan --packs spec-gate > spec-gate-plan.txt
          grep -oE 'crates/mega-evm/[^:]+:[0-9]+:[0-9]+: spec-gate .*' spec-gate-plan.txt >> universe.txt || [ $? -eq 1 ]
          echo "universe: $(wc -l < universe.txt) mutants"
      - name: Check for orphan suppressions
        run: |
          python3 scripts/mutation_gate.py orphans \
            --suppressions mutants/suppressions.toml \
            --universe universe.txt
