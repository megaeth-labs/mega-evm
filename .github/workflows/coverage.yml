name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - satin
      - 'release-*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mega-evm-core:
    name: mega-evm core coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov upload over OIDC; no token secret
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage reports
        run: scripts/coverage_mega_evm.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-evm-coverage
          path: target/coverage/mega-evm
          if-no-files-found: error

      - name: Record Rust version
        run: echo "RUST=$(rustc --version)" >> "$GITHUB_ENV"

      # A failed upload does not fail the job (Codecov being down must not turn every PR red), but
      # it is reported: the next step warns, so a missing report is seen rather than silent.
      - name: Upload coverage to Codecov
        id: codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          disable_search: true
          fail_ci_if_error: true
          files: target/coverage/mega-evm/lcov.info
          flags: mega-evm-core
          name: mega-evm-core
          use_oidc: true
          env_vars: RUST
          verbose: true

      - name: Warn when the Codecov upload failed
        if: steps.codecov.outcome == 'failure'
        run: |
          echo "::warning title=Codecov upload failed::The coverage report did not reach Codecov, so no coverage comment or status follows. See the upload step's log."
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> The Codecov upload failed: no coverage comment or status for this run. See the upload step's log." >> "$GITHUB_STEP_SUMMARY"
