[package]
name = "mega-evme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "MegaETH executable EVM"
readme = "README.md"
default-run = "mega-evme"

[lints]
workspace = true

[[bin]]
name = "mega-evme"
path = "src/main.rs"

[dependencies]
# megaeth
mega-evm = { workspace = true, features = ["default", "test-utils"] }
mega-evm-legacy = { workspace = true, optional = true, features = ["std", "test-utils"] }
mega-evme-legacy = { workspace = true, optional = true }

# revm
revm = { workspace = true, features = ["alloydb"] }
revm-inspectors = { workspace = true, features = ["std"] }

# alloy
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-eips.workspace = true
alloy-json-rpc.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-rpc-client = { workspace = true, features = ["reqwest"] }
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-trace.workspace = true
alloy-serde = { workspace = true, features = ["default"] }
alloy-sol-types.workspace = true
alloy-transport.workspace = true
alloy-transport-http = { workspace = true, features = ["reqwest"] }
alloy-trie = { workspace = true, features = ["std", "ethereum"] }

# op
op-alloy-consensus.workspace = true
op-alloy-network.workspace = true
op-alloy-rpc-types.workspace = true

# misc
clap = { workspace = true, features = ["default", "env"] }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std", "ansi"] }
zstd.workspace = true

[dev-dependencies]
mega-evme = { path = ".", features = ["test-utils"] }
mega-state-test-legacy.workspace = true
rstest.workspace = true
wiremock.workspace = true

[features]
default = ["legacy"]
# The legacy leg: specs `Equivalence` through `Rex6` run on the released 1.7.1 CLI and engine,
# linked beside the Satin engine. Without it the binary runs Satin only.
legacy = ["dep:mega-evm-legacy", "dep:mega-evme-legacy"]
test-utils = []

[lib]
name = "mega_evme"
path = "src/lib.rs"
