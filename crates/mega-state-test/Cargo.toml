[package]
name = "mega-state-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Execution-spec state-test runner for the mega-evm Satin engine"
readme = "README.md"

[lints]
workspace = true

[dependencies]
mega-evm = { workspace = true, features = ["default", "test-utils"] }

# revm
# `test-types` brings the fork's own state-test fixture types, the ones its runner reads.
revm = { workspace = true, features = ["std", "test-types", "tracer"] }

# alloy
alloy-rlp = { workspace = true, features = ["std"] }
alloy-trie = { workspace = true, features = ["std", "ethereum"] }

# misc
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Published as `mega-state-test`; the library keeps the `state_test` import name.
[lib]
name = "state_test"
path = "src/lib.rs"
