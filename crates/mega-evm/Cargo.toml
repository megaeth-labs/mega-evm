[package]
name = "mega-evm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The evm tailored for the MegaETH"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# alloy
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-hardforks.workspace = true
alloy-op-evm.workspace = true
alloy-op-hardforks.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
op-alloy-consensus.workspace = true
op-revm = { workspace = true, features = ["dev", "serde"] }

# revm
revm = { workspace = true, features = ["dev", "serde"] }

# megaeth
mega-system-contracts = { workspace = true, default-features = false }

# misc
auto_impl.workspace = true
delegate.workspace = true
derive_more = { workspace = true, optional = true, features = ["debug", "deref", "deref_mut", "display", "error"] }
serde = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
# alloy
alloy-rpc-types-trace = { workspace = true }
alloy-trie = { workspace = true, features = ["std", "ethereum"] }

# CodSpeed drop-in: `codspeed-criterion-compat` re-exports criterion's API, so
# `use criterion::...` in the benches is unchanged. Under a normal `cargo bench`
# it behaves exactly like criterion; under `cargo codspeed` it runs each bench
# once under valgrind and reports layout-insensitive instruction counts.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
mega-evm = { path = ".", features = ["test-utils"] }
proptest = { workspace = true, features = ["std"] }
revm = { workspace = true, features = ["tracer"] }
revm-inspectors = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[features]
default = ["std", "revm/default", "op-revm/default"]
std = [
    "alloy-evm/std",
    "alloy-op-evm/std",
    "mega-system-contracts/std",
    "op-revm/std",
    "revm/std",
]
test-utils = ["dep:derive_more"]
# Measurement-only: lets a process fix other Satin byte prices than the constants, through
# `install_satin_prices` or the `MEGA_SATIN_CPSB` / `MEGA_SATIN_CPHB` environment variables.
# Off by default, so a normal build prices with the constants and has no way to do otherwise.
satin-price-override = ["std"]

# The Satin bench set: `transact` (MegaEvm next to op-revm), `corpus` (the JSON scenarios under
# benches/scenarios, a bench input), `factory` (EVM construction) and `block` (a block through
# MegaBlockExecutor). The inputs under benches/data (revm_bench) and benches/fixtures
# (attack_replay) stay for the rebuild of the rest of the suite.
[[bench]]
name = "block"
harness = false

[[bench]]
name = "corpus"
harness = false

[[bench]]
name = "factory"
harness = false

[[bench]]
name = "transact"
harness = false
