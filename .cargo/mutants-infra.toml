# cargo-mutants configuration for the test gates' own infrastructure.
#
# The canonical run (.cargo/mutants.toml) mutates mega-evm production code and excludes test
# helpers as noise. By that rule the scenario runner (its transaction conversion and its
# execute/commit loop) is helper code, but it is executable logic the benches and later tests rest
# on. This config mutates exactly that; the production run keeps its exclusions unchanged.
#
# Selected by `scripts/mutation_test.sh infra`, which passes the file globs. See mutants/README.md.

test_tool = "nextest"
# mega-evm's tests cover the scenario runner.
test_package = ["mega-evm"]

# Same pinned feature set as the production run, so the two generate comparable mutants.
additional_cargo_args = ["--all-features"]

# No `**/test_utils/**` exclusion here: the scenario runner living under it is the subject.
exclude_globs = ["**/generated/**"]

minimum_test_timeout = 120
timeout_multiplier = 3.0
copy_target = true
